<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>topara</title>
  <link rel="preload" as="image" href="assets/logo-montana.png">
  <link rel="preload" as="image" href="assets/logo-estrella.png">
  <link rel="preload" as="image" href="assets/logo-texto.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" id="app">
    <section class="pantalla splash" id="splash" aria-label="topara">
      <div class="grupo">
        <div class="logo" id="logo">
          <img class="montana" id="montana" src="assets/logo-montana.png" alt="" decoding="async">
          <img class="estrella" id="estrella" src="assets/logo-estrella.png" alt="" decoding="async">
        </div>
        <img class="texto" id="texto" src="assets/logo-texto.png" alt="topara" decoding="async">
      </div>
    </section>
    <section class="pantalla registro" id="registro" aria-label="Registro">
      <p class="pendiente">Registro (pendiente de diseñar)</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
